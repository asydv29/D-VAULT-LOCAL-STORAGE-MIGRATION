<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script>(function(d){try{var ua=navigator.userAgent,im=/ mobile/i.test(ua),K="dpWasMobile";if(im){localStorage.setItem(K,"1");return}if(localStorage.getItem(K)!=="1")return;var m=d.querySelector('meta[name="viewport"]');if(!m){m=d.createElement("meta");m.setAttribute("name","viewport");d.head.appendChild(m)}m.setAttribute("content","width=1280")}catch(e){}})(document);</script>
<meta name="theme-color" content="#0f0f0f">
<title>Downloads — D Vault</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<style>
.dl-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.dl-head h1{font-size:20px;margin:0}
.dl-storage{color:#aaa;font-size:12px}
.dl-card{cursor:pointer}
.dl-card .thumb{background:#000}
.dl-card .thumb img,.dl-card .thumb .no-poster{width:100%;height:100%;object-fit:cover;display:block}
.dl-card .no-poster{display:flex;align-items:center;justify-content:center;color:#666;font-size:34px;background:#1c1c1c}
.dl-remove{border:0;background:transparent;color:#ff6b6b;font-size:12px;cursor:pointer;padding:4px 0}
.dl-size{color:#aaa;font-size:12px;margin:2px 0 0}
.dl-player{display:none;position:fixed;inset:0;background:#000;z-index:200;align-items:center;justify-content:center}
.dl-player.show{display:flex}
.dl-player video{width:100%;height:100%;max-height:100vh;object-fit:contain}
.dl-player-close{position:absolute;top:14px;left:16px;background:transparent;color:#fff;border:0;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20}
.dl-player-close svg{filter:drop-shadow(0 1px 3px #000a) drop-shadow(0 0 2px #0008)}
.dl-card.dl-pending{cursor:default}
.dl-card.dl-pending .thumb{display:flex;align-items:center;justify-content:center;background:#1c1c1c;color:#666;font-size:28px}
.dl-progress{height:4px;border-radius:2px;background:#333;overflow:hidden;margin:6px 0 2px}
.dl-progress-bar{height:100%;background:#3ea6ff;transition:width .3s ease}
.dl-progress-bar.indeterminate{width:35%;animation:mtDlIndeterminate 1.1s ease-in-out infinite}
@keyframes mtDlIndeterminate{0%{margin-left:0%}50%{margin-left:65%}100%{margin-left:0%}}
.dl-pct{color:#aaa;font-size:12px}
.dl-cancel{border:0;background:transparent;color:#ff6b6b;font-size:12px;cursor:pointer;padding:4px 0}
</style>
<script src="/local-storage.js"></script><script src="/local-preview.js"></script><script src="/local-api.js"></script><script src="/local-bootstrap.js"></script></head>
<body class="home-page">
<header class="home-topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
  <a class="home-brand" href="/" aria-label="D Vault home">
    <img class="brand-logo" src="/d-vault-logo.svg" alt="D Vault">
  </a>
  <form class="home-search" id="dlSearchForm">
    <input id="dlSearch" autocomplete="off" placeholder="Search downloads" aria-label="Search downloads">
  </form>
  <div class="topbar-icons">
    <button type="button" class="icon-btn topbar-search-btn" id="dlSearchToggleBtn" aria-label="Search" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    </button>
    <button class="avatar" id="avatarBtn" type="button" aria-label="Account">
      <span class="avatar-initial" id="avatarInitial">A</span>
    </button>
  </div>
</header>

<div class="home-layout">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <script>window.DP_SIDEBAR_SKIP=['toggle'];</script>
  <script src="/sidebar.js"></script>

  <main class="home-content">
    <section class="home-section">
      <div class="dl-head">
        <h1>Downloads</h1>
        <span class="dl-storage" id="dlStorage"></span>
      </div>
      <div id="grid" class="video-grid"></div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>
<div class="dl-player" id="dlPlayer">
  <button class="dl-player-close" id="dlPlayerClose" aria-label="Close"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-8 7 8 7"/></svg></button>
  <video id="dlVideo" playsinline></video>
</div>

<script src="/offline.js"></script>

<script src="/idb-store.js"></script>
<script src="/idb-downloads.js"></script>
<script src="/offline-player.js"></script>
<script src="/downloads.js"></script>
</body>
</html>
