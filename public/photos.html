<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script>(function(d){try{var ua=navigator.userAgent,im=/ mobile/i.test(ua),K="dpWasMobile";if(im){localStorage.setItem(K,"1");return}if(localStorage.getItem(K)!=="1")return;var m=d.querySelector('meta[name="viewport"]');if(!m){m=d.createElement("meta");m.setAttribute("name","viewport");d.head.appendChild(m)}m.setAttribute("content","width=1280")}catch(e){}})(document);</script>
<meta name="theme-color" content="#0f0f0f">
<title>Photos — D Vault</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<style>
.photos-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.photos-head-title{display:flex;align-items:baseline;gap:10px}
.photos-head h1{font-size:20px;margin:0}
.photos-count{color:#aaa;font-size:12px}
.photo-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
@media(max-width:1200px){.photo-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:900px){.photo-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.photo-tile{position:relative;display:block;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:#1c1c1c;border:0;padding:0;cursor:pointer}
.photo-tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.photo-tile:hover img{transform:scale(1.03)}
.photo-tile .photo-like-badge{position:absolute;right:6px;top:6px;background:#0008;color:#ff5470;font-size:14px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.photo-tile .photo-video-badge{position:absolute;left:6px;bottom:6px;background:#0008;color:#fff;font-size:13px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.photos-import-btn{margin-left:auto;height:36px;padding:0 16px;border-radius:18px;border:1px solid #303030;background:#222;color:#fff;font-size:13px;cursor:pointer;white-space:nowrap}
.photos-import-btn:hover{background:#2b2b2b}
.photos-import-btn:disabled{opacity:.6;cursor:default}
.photos-search{height:40px;display:flex;max-width:320px}
.photos-search input{flex:1;min-width:60px;background:#121212;border:1px solid #303030;border-right:0;color:#fff;padding:0 14px;font-size:14px;border-radius:20px 0 0 20px;outline:none}
.photos-search input:focus{border-color:#3ea6ff}
.photos-search button{width:44px;border:1px solid #303030;background:#222;color:#fff;border-radius:0 20px 20px 0;font-size:18px;cursor:pointer}
.photo-viewer{display:none;position:fixed;inset:0;background:#000d;z-index:200;align-items:center;justify-content:center;flex-direction:column}
.photo-viewer.show{display:flex}
.photo-viewer-bar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;z-index:2}
.photo-viewer-bar-left{display:flex;align-items:center;gap:14px}
.photo-viewer-counter{color:#fff;font-size:15px}
.photo-viewer-actions{display:flex;align-items:center;gap:18px}
.photo-viewer-bar button,.photo-viewer-bar a{border:0;background:transparent;color:#fff;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;text-decoration:none}
.photo-viewer-bar svg{filter:drop-shadow(0 1px 2px #0009)}
.photo-viewer-actions .is-liked svg{fill:#ff5470;stroke:#ff5470}
.photo-viewer-img{max-width:94vw;max-height:78vh;object-fit:contain;border-radius:4px}
.photo-viewer-video{max-width:94vw;max-height:78vh;border-radius:4px}
.photo-viewer-nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:#0007;color:#fff;width:44px;height:44px;border-radius:50%;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center}
.photo-viewer-prev{left:14px}
.photo-viewer-next{right:14px}
.photo-viewer-more-menu{position:absolute;top:52px;right:16px;background:#181818;border:1px solid #303030;border-radius:10px;padding:6px;display:none;flex-direction:column;min-width:150px;z-index:3;box-shadow:0 6px 20px #000a}
.photo-viewer-more-menu.show{display:flex}
.photo-viewer-more-menu a,.photo-viewer-more-menu button{justify-content:flex-start;width:100%;padding:9px 10px;border-radius:6px;font-size:13px;color:#fff}
.photo-viewer-more-menu a:hover,.photo-viewer-more-menu button:hover{background:#2a2a2a}
.photo-viewer-filmstrip{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 16px;overflow-x:auto;background:linear-gradient(0deg,#000a,transparent);z-index:2;scrollbar-width:none}
.photo-viewer-filmstrip::-webkit-scrollbar{display:none}
.photo-viewer-filmstrip button{flex:0 0 auto;width:52px;height:52px;border-radius:8px;overflow:hidden;padding:0;border:2px solid transparent;background:#000;cursor:pointer;opacity:.55;transition:opacity .12s ease,border-color .12s ease}
.photo-viewer-filmstrip button.active{opacity:1;border-color:#fff}
.photo-viewer-filmstrip img{width:100%;height:100%;object-fit:cover;display:block}
@media(max-width:700px){.photo-viewer-nav{width:36px;height:36px}.photos-search{display:none}.photo-viewer-filmstrip button{width:44px;height:44px}}
</style>
<script src="/local-storage.js"></script><script src="/local-preview.js"></script><script src="/local-api.js"></script><script src="/local-bootstrap.js"></script></head>
<body class="home-page">
<header class="home-topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
  <a class="home-brand" href="/" aria-label="D Vault home">
    <img class="brand-logo" src="/d-vault-logo.svg" alt="D Vault">
  </a>
  <form class="home-search photos-search" id="photosSearchForm">
    <input id="photosSearch" autocomplete="off" placeholder="Search photos" aria-label="Search photos">
  </form>
  <div class="topbar-icons">
    <button type="button" class="icon-btn topbar-search-btn" id="photosSearchToggleBtn" aria-label="Search" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    </button>
    <button class="avatar" id="avatarBtn" type="button" aria-label="Account">
      <span class="avatar-initial" id="avatarInitial">A</span>
    </button>
  </div>
</header>

<div class="home-layout">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <script>window.DP_SIDEBAR_SKIP=['toggle','liked','account'];</script>
  <script src="/sidebar.js"></script>

  <main class="home-content">
    <section class="home-section">
      <div class="photos-head">
        <div class="photos-head-title">
          <h1 id="photosTitle">Photos</h1>
          <span class="photos-count" id="photosCount"></span>
        </div>
        <button type="button" id="importBtn" hidden>Import</button>
      </div>
      <div id="grid" class="photo-grid"></div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<div class="photo-viewer" id="photoViewer">
  <div class="photo-viewer-bar">
    <div class="photo-viewer-bar-left">
      <button type="button" id="viewerClose" aria-label="Close"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <span class="photo-viewer-counter" id="viewerCounter"></span>
    </div>
    <div class="photo-viewer-actions">
      <button type="button" class="viewer-zoom" id="viewerZoomOut" aria-label="Zoom out" title="Zoom out (-)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/></svg></button>
      <button type="button" class="viewer-zoom" id="viewerZoomIn" aria-label="Zoom in" title="Zoom in (+)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6M11 8v6"/></svg></button>
      <button type="button" id="viewerLike" aria-label="Like"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.7-4.35-9.3-8.1C1 10 1.6 6.3 4.6 4.9c2.4-1.1 4.9-.2 6.4 1.7l1 1.3 1-1.3c1.5-1.9 4-2.8 6.4-1.7 3 1.4 3.6 5.1 1.9 8C18.7 16.65 12 21 12 21z"/></svg></button>
      <button type="button" id="viewerDelete" aria-label="Delete"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
      <button type="button" id="viewerMore" aria-label="More options"><svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></button>
      <div class="photo-viewer-more-menu" id="viewerMoreMenu">
        <button type="button" id="viewerSlideshow">Start slideshow</button>
        <button type="button" id="viewerFullscreen">Fullscreen</button>
        <button type="button" id="viewerShare">Share</button>
        <a id="viewerDownload" href="#" download>Download</a>
      </div>
    </div>
  </div>
  <button type="button" class="photo-viewer-nav photo-viewer-prev" id="viewerPrev" aria-label="Previous"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-8 7 8 7"/></svg></button>
  <img class="photo-viewer-img" id="viewerImg" alt="">
  <video class="photo-viewer-video" id="viewerVideo" controls playsinline hidden></video>
  <button type="button" class="photo-viewer-nav photo-viewer-next" id="viewerNext" aria-label="Next"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l8 7-8 7"/></svg></button>
  <div class="photo-viewer-filmstrip" id="viewerFilmstrip"></div>
</div>

<script src="/offline.js"></script>

<script src="/photos.js"></script>
</body>
</html>
