<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><script>(function(d){try{var ua=navigator.userAgent,im=/ mobile/i.test(ua),K="dpWasMobile";if(im){localStorage.setItem(K,"1");return}if(localStorage.getItem(K)!=="1")return;var m=d.querySelector('meta[name="viewport"]');if(!m){m=d.createElement("meta");m.setAttribute("name","viewport");d.head.appendChild(m)}m.setAttribute("content","width=1280")}catch(e){}})(document);</script>
<meta name="theme-color" content="#000000">
<title>Shorts — D Vault</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/shorts.css">
<script src="/perf.js" defer></script><script src="/local-storage.js"></script><script src="/local-preview.js"></script><script src="/local-api.js"></script><script src="/local-bootstrap.js"></script><script src="/local-progress.js"></script>
</head>
<body class="shorts-page home-page">

<div id="shortsFeed" class="shorts-feed"></div>

<div id="shortsEmpty" class="shorts-empty" hidden>
  <div class="shorts-empty-icon">◈</div>
  <h2>No Shorts yet</h2>
  <p>Mark a video as a Short from its ⋮ menu on the home page and it will play here.</p>
  <a href="/" class="shorts-empty-btn">← Back to D Vault</a>
</div>

<div id="shortsLoading" class="shorts-loading"><div class="shorts-spinner"></div></div>

<!-- Shared "more" menu (speed / quality). Positioned over whichever slide is active. -->
<div class="shorts-more-menu" id="shortsMoreMenu" hidden>
  <div class="shorts-more-panel" id="shortsMoreMain">
    <button type="button" class="shorts-more-item" id="shortsSpeedBtn"><span>Playback speed</span><span class="shorts-more-value" id="shortsSpeedValue">Normal</span></button>
    <button type="button" class="shorts-more-item" id="shortsReverseBtn"><span>Reverse play</span><span class="shorts-more-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6 8.5 6V6l-8.5 6z"></path></svg></span></button>
    <button type="button" class="shorts-more-item" id="shortsQualityBtn"><span>Quality</span><span class="shorts-more-value" id="shortsQualityValue">Original</span></button>
    <button type="button" class="shorts-more-item" id="shortsWatchFullBtn"><span>Watch as full video</span><span class="shorts-more-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M10 9.5v5l4.5-2.5z" fill="currentColor" stroke="none"></path></svg></span></button>
    <button type="button" class="shorts-more-item" id="shortsDownloadDeviceBtn"><span>Download to device</span><span class="shorts-more-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"></path></svg></span></button>
    <button type="button" class="shorts-more-item" id="shortsWatchLaterBtn"><span id="shortsWatchLaterLabel">Save to Watch Later</span><span class="shorts-more-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg></span></button>
    <button type="button" class="shorts-more-item" id="shortsPipBtn"><span>Picture in picture</span><span class="shorts-more-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="1.5"></rect><rect x="12" y="11" width="7" height="5" rx="1" fill="currentColor" stroke="none"></rect></svg></span></button>
    <button type="button" class="shorts-more-item" id="shortsReportBtn"><span>Copy link</span><span class="shorts-more-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"></path></svg></span></button>
    <button type="button" class="shorts-more-item" id="shortsDetailsBtn"><span>Details</span><span class="shorts-more-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><circle cx="12" cy="7.8" r=".6" fill="currentColor"></circle></svg></span></button>
    <button type="button" class="shorts-more-item" id="shortsRemoveBtn"><span>Remove from Shorts</span><span class="shorts-more-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3 21 12 12 21 3 12Z"></path><path d="M9.5 9.5l5 5m0-5-5 5"></path></svg></span></button>
  </div>
  <div class="shorts-more-panel shorts-more-sub hidden" id="shortsDetailsPanel">
    <button type="button" class="shorts-more-back" data-back>‹ Details</button>
    <div class="shorts-details-body" id="shortsDetailsBody"></div>
  </div>
  <div class="shorts-more-panel shorts-more-sub hidden" id="shortsSpeedPanel">
    <button type="button" class="shorts-more-back" data-back>‹ Playback speed</button>
    <button data-speed=".5">0.5×</button>
    <button data-speed=".75">0.75×</button>
    <button data-speed="1">Normal</button>
    <button data-speed="1.25">1.25×</button>
    <button data-speed="1.5">1.5×</button>
    <button data-speed="1.75">1.75×</button>
    <button data-speed="2">2×</button>
  </div>
  <div class="shorts-more-panel shorts-more-sub hidden" id="shortsQualityPanel">
    <button type="button" class="shorts-more-back" data-back>‹ Quality</button>
    <button data-quality="auto" class="active">Auto</button>
    <button data-quality="original">Original</button>
    <div class="shorts-quality-status" id="shortsQualityStatus" hidden></div>
  </div>
</div>

<div class="shorts-menu-backdrop" id="shortsMenuBackdrop" hidden></div>

<!-- You / account popover -->
<div class="shorts-toast" id="shortsToast"></div>

<script src="/offline.js"></script>

<script src="/idb-store.js"></script>
<script src="/idb-downloads.js"></script>
<script src="/reverse-play.js"></script>
<script src="/shorts.js"></script>
</body>
</html>
